<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Company Events | SmartHR AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .ai-btn { transition: all .2s; }
        .ai-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(99,102,241,.25); }
        .shimmer {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
        }
        @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }
        .ai-badge { animation: pulseBadge 2s infinite; }
        @keyframes pulseBadge {
            0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,.4); }
            50%      { box-shadow: 0 0 0 6px rgba(99,102,241,0); }
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-12">
    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-4">
            <div>
                <a href="index.html" class="inline-flex items-center text-blue-400 hover:text-blue-300 font-bold mb-2 transition-all group">
                    <i class="fas fa-arrow-left mr-2 group-hover:-translate-x-1 transition-transform"></i>
                    Back to Dashboard
                </a>
                <h1 class="text-4xl font-black italic tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500 uppercase">
                    Upcoming Events
                </h1>
                <p class="text-slate-500 text-xs font-bold tracking-widest mt-1 uppercase">Don't miss out on corporate action</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs bg-blue-950/80 text-blue-300 border border-blue-800/50 px-3.5 py-1.5 rounded-full font-bold uppercase tracking-wider hidden md:inline-block">
                    Workforce Calendar
                </span>
                <button type="button" onclick="aiAnalyzeSchedule()"
                    class="ai-btn flex items-center gap-2 text-xs font-black bg-gradient-to-r from-violet-500 to-purple-600 text-white px-4 py-2 rounded-xl ai-badge">
                    <i class="fas fa-wand-magic-sparkles"></i> AI Priority Match
                </button>
            </div>
        </header>

        <!-- AI Match Box -->
        <div id="aiMatchBox" class="hidden mb-8 p-6 bg-slate-900 border border-violet-500/30 rounded-3xl relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10 text-violet-500 text-6xl transform rotate-12"><i class="fas fa-robot"></i></div>
            <h3 class="text-sm font-black text-violet-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                <i class="fas fa-bolt text-amber-400"></i> AI Schedule Priorities
            </h3>
            <div id="aiMatchLoader" class="hidden shimmer h-12 w-full max-w-lg mb-2 rounded-xl"></div>
            <div id="aiMatchTxt" class="text-slate-300 text-sm leading-relaxed font-medium relative z-10 whitespace-pre-line"></div>
        </div>

        <!-- Events Catalog Grid -->
        <div id="eventContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="h-64 bg-slate-900/50 border border-white/5 rounded-[2rem] animate-pulse"></div>
            <div class="h-64 bg-slate-900/50 border border-white/5 rounded-[2rem] animate-pulse"></div>
            <div class="h-64 bg-slate-900/50 border border-white/5 rounded-[2rem] animate-pulse"></div>
        </div>
    </div>

    <!-- Event Details Modal -->
    <div id="eventDetailsModal"
        class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-[2rem] w-full max-w-lg p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeEventDetailsModal()" class="absolute top-6 right-6 text-slate-400 hover:text-white transition">
                <i class="fas fa-times text-lg"></i>
            </button>
            <div id="modalEventContent"></div>
        </div>
    </div>

    <script>
        let allEvents = [];

        document.addEventListener("DOMContentLoaded", function() {
            // Authentication check
            fetch('/api/current-user')
                .then(res => {
                    if (res.ok) return res.json();
                    window.location.href = 'login.html';
                })
                .then(() => {
                    fetchEvents();
                })
                .catch(() => {
                    window.location.href = 'login.html';
                });
        });

        async function fetchEvents() {
            try {
                const res = await fetch('/api/events/upcoming');
                const data = await res.json();
                allEvents = data;
                
                const container = document.getElementById('eventContainer');
                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-3 py-16 bg-slate-900/20 border border-white/5 rounded-[2.5rem] text-center text-slate-500 italic w-full">
                            <i class="fas fa-calendar-times text-4xl mb-4 text-slate-600 block"></i>
                            No upcoming company events scheduled.
                        </div>`;
                    return;
                }

                container.innerHTML = data.map((event, index) => {
                    const eventDate = new Date(event.eventDate);
                    const day = eventDate.getDate();
                    const month = eventDate.toLocaleString('default', { month: 'short' });

                    return `
                        <div onclick="showEventDetails(${index})" 
                            class="cursor-pointer bg-slate-900/30 border border-white/5 rounded-[2.5rem] overflow-hidden hover:border-blue-500/30 transition-all hover:-translate-y-1 duration-200 group shadow-lg flex flex-col justify-between h-full">
                            <div class="p-8">
                                <div class="flex justify-between items-start mb-6">
                                    <div class="bg-blue-600 text-white p-3.5 rounded-2xl text-center min-w-[64px] shadow-lg shadow-blue-500/10">
                                        <span class="block text-2xl font-black">${day}</span>
                                        <span class="block text-[10px] font-bold uppercase tracking-wider">${month}</span>
                                    </div>
                                    <span class="text-[9px] font-black uppercase tracking-wider px-3 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700">
                                        ${event.eventType || 'Other'}
                                    </span>
                                </div>
                                <h3 class="text-xl font-bold text-white mb-2 group-hover:text-blue-400 transition duration-150">${event.eventName}</h3>
                                <p class="text-slate-400 text-sm mb-6 line-clamp-2 leading-relaxed">${event.description || 'No details logged.'}</p>
                                
                                <div class="space-y-2.5 border-t border-white/5 pt-6 text-xs font-semibold text-slate-400">
                                    <div class="flex items-center">
                                        <i class="fas fa-clock mr-3 text-blue-500/40 text-sm"></i> ${event.eventTime || 'N/A'}
                                    </div>
                                    <div class="flex items-center">
                                        <i class="fas fa-map-marker-alt mr-3 text-blue-500/40 text-sm"></i> ${event.location || 'N/A'}
                                    </div>
                                </div>
                            </div>
                        </div>`;
                }).join('');
            } catch (error) {
                console.error("Error loading events:", error);
                document.getElementById('eventContainer').innerHTML = `
                    <div class="col-span-3 p-6 text-center text-rose-400 font-bold bg-rose-950/20 border border-rose-900/35 rounded-2xl w-full">
                        Error fetching upcoming events from server.
                    </div>`;
            }
        }

        function showEventDetails(index) {
            const event = allEvents[index];
            if (!event) return;

            const eventDate = new Date(event.eventDate);
            const dateStr = eventDate.toLocaleDateString('default', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const isZoom = event.location.toLowerCase().includes('zoom') || event.eventType === 'Meeting' || event.eventType === 'Workshop';

            let videoHtml = '';
            if (isZoom) {
                videoHtml = `
                <div class="mt-6 border-t border-slate-800 pt-6">
                    <h4 class="text-white font-bold mb-3 flex items-center text-sm"><i class="fas fa-video text-blue-500 mr-2"></i> Meeting Session Preview</h4>
                    <div class="rounded-xl overflow-hidden shadow-2xl border-2 border-slate-700 bg-black aspect-video relative">
                        <div class="absolute top-2 left-2 z-10 bg-black/60 px-2 py-0.5 rounded text-[9px] text-white flex items-center gap-1.5 uppercase font-bold tracking-wider">
                            <span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span> Recorded
                        </div>
                        <video controls class="w-full h-full object-cover">
                            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                </div>`;
            }

            document.getElementById('modalEventContent').innerHTML = `
                <div class="flex items-center gap-4 mb-6">
                    <div class="bg-blue-600/20 text-blue-400 p-4 rounded-2xl">
                        <i class="fas fa-calendar-alt text-2xl"></i>
                    </div>
                    <div>
                        <span class="text-[9px] font-black uppercase tracking-wider text-blue-400">${event.eventType}</span>
                        <h3 class="text-xl font-bold text-white leading-tight mt-0.5">${event.eventName}</h3>
                    </div>
                </div>
                <div class="bg-slate-950 rounded-2xl p-5 mb-5 border border-white/5">
                    <p class="text-slate-400 text-sm leading-relaxed">${event.description || 'No description provided.'}</p>
                </div>
                <div class="space-y-3.5 bg-slate-950 rounded-2xl p-5 border border-white/5 text-xs font-bold text-slate-300">
                    <div class="flex items-center">
                        <i class="fas fa-calendar-day w-6 text-center text-slate-500 mr-3"></i> ${dateStr}
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-clock w-6 text-center text-slate-500 mr-3"></i> ${event.eventTime || 'N/A'}
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-map-marker-alt w-6 text-center text-slate-500 mr-3"></i> ${event.location || 'N/A'}
                    </div>
                </div>
                ${videoHtml}
                <button onclick="closeEventDetailsModal()" class="w-full mt-6 bg-slate-800 text-white font-bold py-3.5 rounded-xl hover:bg-slate-700 transition">
                    Close Details
                </button>
            `;

            document.getElementById('eventDetailsModal').classList.remove('hidden');
            document.getElementById('eventDetailsModal').classList.add('flex');
        }

        function closeEventDetailsModal() {
            document.getElementById('eventDetailsModal').classList.add('hidden');
            document.getElementById('eventDetailsModal').classList.remove('flex');
        }

        /* ─── GEMINI AI ─── */
        const GEMINI_KEY = "AIzaSyDemo_Replace_With_Your_Key";
        async function callGemini(prompt) {
            const r = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,
                { method:'POST', headers:{'Content-Type':'application/json'},
                  body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] }) }
            );
            if (!r.ok) throw new Error('API error');
            const d = await r.json();
            return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
        }

        async function aiAnalyzeSchedule() {
            const box = document.getElementById('aiMatchBox');
            const loader = document.getElementById('aiMatchLoader');
            const txt = document.getElementById('aiMatchTxt');

            box.classList.remove('hidden');
            loader.classList.remove('hidden');
            txt.textContent = '';

            if (allEvents.length === 0) {
                txt.textContent = "You don't have any upcoming events to analyze.";
                loader.classList.add('hidden');
                return;
            }

            const eventsTxt = allEvents.map(e => `${e.eventName} (${e.eventType}) on ${e.eventDate}`).join('\n');
            const prompt = `You are an AI assistant helping an employee prioritize their schedule. Review these upcoming events:\n${eventsTxt}\n\nWrite a 2-bullet summary highlighting which events are most critical to attend. Keep it very short.`;

            try {
                const summary = await callGemini(prompt);
                txt.innerHTML = summary.replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>').replace(/\n/g, '<br>');
            } catch(e) {
                txt.innerHTML = `<strong class="text-white">Smart Match:</strong><br>- You have ${allEvents.length} events scheduled.<br>- Prioritize attending "${allEvents[0]?.eventName}" as it appears to be the most imminent.`;
            }

            loader.classList.add('hidden');
        }
    </script>
</body>

</html>
