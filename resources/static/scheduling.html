<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHR AI Auto-Scheduling - Redirecting...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
        }
        .ai-glow {
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.4);
        }
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-white px-4">

    <div class="text-center max-w-md animate-pulse-slow">
        <!-- AI Glowing Logo container -->
        <div class="relative w-24 h-24 mx-auto mb-8 bg-gradient-to-tr from-blue-500 via-indigo-500 to-purple-600 rounded-[2rem] flex items-center justify-center shadow-2xl ai-glow">
            <i class="fas fa-calendar-check text-4xl text-white"></i>
            <div class="absolute -inset-1 rounded-[2rem] bg-blue-500/20 blur-md -z-10 animate-ping"></div>
        </div>

        <h1 class="text-3xl font-black mb-2 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
            SmartHR AI Auto-Scheduling
        </h1>
        <p class="text-slate-400 text-sm mb-6">Analyzing calendar availability & loading scheduling dashboard...</p>

        <!-- Loading Bar -->
        <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden mb-6 border border-slate-700">
            <div class="bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 h-full rounded-full animate-[loading_1.5s_infinite_ease-in-out]" style="width: 40%;"></div>
        </div>
    </div>

    <style>
        @keyframes loading {
            0% { transform: translateX(-100%); width: 30%; }
            50% { width: 60%; }
            100% { transform: translateX(250%); width: 30%; }
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                fetch('/api/current-user')
                    .then(res => {
                        if (res.ok) return res.json();
                        throw new Error('Unauthenticated');
                    })
                    .then(user => {
                        if (user.role === 'ADMIN') {
                            window.location.href = 'scheduling-admin.html';
                        } else {
                            window.location.href = 'scheduling-employee.html';
                        }
                    })
                    .catch(err => {
                        console.error('Redirecting to login:', err);
                        window.location.href = 'login.html';
                    });
            }, 800); // Cinematic experience delay
        });
    </script>
</body>
</html>
