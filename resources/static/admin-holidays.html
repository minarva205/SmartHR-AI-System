<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Holiday Calendar | SmartHR AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .ai-btn { transition: all .2s; }
        .ai-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(99,102,241,.25); }
        .shimmer {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            border-radius: 12px;
        }
        @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }
        .ai-badge { animation: pulseBadge 2s infinite; }
        @keyframes pulseBadge {
            0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,.4); }
            50%      { box-shadow: 0 0 0 6px rgba(99,102,241,0); }
        }
    </style>
</head>

<body class="bg-slate-50 font-sans text-slate-800">
    <div class="max-w-6xl mx-auto px-6 py-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
            <div>
                <a href="index.html" class="inline-flex items-center text-blue-600 hover:text-blue-800 font-bold mb-2 transition-all group">
                    <i class="fas fa-arrow-left mr-2 group-hover:-translate-x-1 transition-transform"></i>
                    Back to Dashboard
                </a>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight">Holiday Calendar 2026</h1>
                <p class="text-slate-500 text-sm mt-0.5">Plan your personal time off, vacations, and observe company holidays</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-full font-bold uppercase tracking-wider hidden md:inline-block">
                    Official Time Off
                </span>
                <button type="button" onclick="aiVacationPlanner()"
                    class="ai-btn flex items-center gap-2 text-xs font-black bg-gradient-to-r from-violet-500 to-purple-600 text-white px-4 py-2 rounded-xl ai-badge">
                    <i class="fas fa-plane-departure"></i> AI Vacation Planner
                </button>
            </div>
        </header>

        <!-- AI Vacation Box -->
        <div id="aiVacationBox" class="hidden mb-8 p-6 bg-gradient-to-br from-violet-50 to-purple-50 border border-violet-100 rounded-3xl relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10 text-violet-500 text-6xl transform rotate-12"><i class="fas fa-umbrella-beach"></i></div>
            <h3 class="text-sm font-black text-violet-700 uppercase tracking-wider mb-2 flex items-center gap-2">
                <i class="fas fa-bolt text-amber-400"></i> AI Long Weekend Suggestions
            </h3>
            <div id="aiVacationLoader" class="hidden shimmer h-12 w-full max-w-lg mb-2"></div>
            <div id="aiVacationTxt" class="text-slate-700 text-sm leading-relaxed font-medium relative z-10 whitespace-pre-line"></div>
        </div>

        <!-- Holiday Listing Table Card -->
        <div class="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h3 class="text-base font-bold text-slate-700">
                    <i class="fas fa-calendar-alt text-blue-500 mr-2"></i>
                    Scheduled Corporate Holidays
                </h3>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/20 text-slate-400 text-[10px] uppercase font-black tracking-wider border-b border-slate-100">
                            <th class="py-4 px-8">Date</th>
                            <th class="py-4 px-8">Holiday Name</th>
                            <th class="py-4 px-8">Classification</th>
                        </tr>
                    </thead>
                    <tbody id="holidayTableBody" class="divide-y divide-slate-100 text-sm text-slate-600 font-semibold">
                        <tr>
                            <td colspan="3" class="py-12 text-center text-slate-400 italic">
                                Loading time off logs...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Authentication check
            fetch('/api/current-user')
                .then(res => {
                    if (res.ok) return res.json();
                    window.location.href = 'login.html';
                })
                .then(() => {
                    fetchHolidays();
                })
                .catch(() => {
                    window.location.href = 'login.html';
                });
        });

        async function fetchHolidays() {
            try {
                const res = await fetch('/api/holidays/all');
                const data = await res.json();
                const body = document.getElementById('holidayTableBody');
                
                if (!data || data.length === 0) {
                    body.innerHTML = `
                        <tr>
                            <td colspan="3" class="py-12 text-center text-slate-400 italic">
                                <i class="fas fa-calendar-times text-3xl mb-3 text-slate-300 block"></i>
                                No scheduled holiday entries found.
                            </td>
                        </tr>`;
                    return;
                }

                body.innerHTML = data.map(h => {
                    const formattedDate = h.holidayDate ? new Date(h.holidayDate).toLocaleDateString(undefined, {
                        day: '2-digit', month: 'short', year: 'numeric'
                    }) : 'N/A';

                    const typePill = h.holidayType === 'Gazetted' ? 'bg-orange-50 text-orange-700 border-orange-100' :
                                     h.holidayType === 'Company-Wide' ? 'bg-indigo-50 text-indigo-700 border-indigo-100' :
                                     'bg-slate-100 text-slate-600 border-slate-200';

                    return `
                        <tr class="hover:bg-slate-50/50 transition">
                            <td class="py-5 px-8 font-bold text-blue-600">${formattedDate}</td>
                            <td class="py-5 px-8 text-slate-800 font-extrabold text-base">${h.holidayName || 'Holiday'}</td>
                            <td class="py-5 px-8">
                                <span class="px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-wider border ${typePill}">
                                    ${h.holidayType || 'General'}
                                </span>
                            </td>
                        </tr>`;
                }).join('');
            } catch (err) {
                console.error("Error fetching holidays:", err);
                document.getElementById('holidayTableBody').innerHTML = `
                    <tr>
                        <td colspan="3" class="py-8 text-center text-rose-500 font-bold bg-rose-50">
                            Failed to connect to corporate calendar server.
                        </td>
                    </tr>`;
            }
        }

        /* ─── GEMINI AI ─── */
        const GEMINI_KEY = "AIzaSyDemo_Replace_With_Your_Key";
        let allHolidaysData = [];
        
        const originalLoadHolidays = fetchHolidays;
        fetchHolidays = async function() {
            await originalLoadHolidays();
            try {
                const res = await fetch('/api/holidays/all');
                allHolidaysData = await res.json();
            } catch(e) {}
        };

        async function callGemini(prompt) {
            const r = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,
                { method:'POST', headers:{'Content-Type':'application/json'},
                  body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] }) }
            );
            if (!r.ok) throw new Error('API error');
            const d = await r.json();
            return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
        }

        async function aiVacationPlanner() {
            const box = document.getElementById('aiVacationBox');
            const loader = document.getElementById('aiVacationLoader');
            const txt = document.getElementById('aiVacationTxt');

            box.classList.remove('hidden');
            loader.classList.remove('hidden');
            txt.textContent = '';

            if (allHolidaysData.length === 0) {
                txt.textContent = "No holidays found to plan around.";
                loader.classList.add('hidden');
                return;
            }

            const dates = allHolidaysData.map(h => `${h.holidayName} (${h.holidayDate})`).join('\n');
            const prompt = `You are an AI Vacation Planner. Given this list of corporate holidays:\n${dates}\n\nSuggest one strategic date where the employee can take a single day off to get a 4-day long weekend. Keep it to 2 brief sentences.`;

            try {
                const suggestion = await callGemini(prompt);
                txt.innerHTML = suggestion.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            } catch(e) {
                txt.innerHTML = `<strong>Smart Suggestion:</strong><br>Consider taking Friday off before ${allHolidaysData[0]?.holidayName} to enjoy an extended 4-day weekend!`;
            }

            loader.classList.add('hidden');
        }
    </script>
</body>

</html>
