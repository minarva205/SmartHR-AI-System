<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Feedback & Suggestions | SmartHR AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .ai-btn { transition: all .2s; }
        .ai-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(99,102,241,.25); }
        .shimmer {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            border-radius: 12px;
        }
        @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }
        .ai-badge { animation: pulseBadge 2s infinite; }
        @keyframes pulseBadge {
            0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,.4); }
            50%      { box-shadow: 0 0 0 6px rgba(99,102,241,0); }
        }
    </style>
</head>

<body class="bg-slate-50 font-sans text-slate-800">
    <div class="max-w-7xl mx-auto px-6 py-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
            <div>
                <a href="index.html" class="inline-flex items-center text-blue-600 hover:text-blue-800 font-bold mb-2 transition-all group">
                    <i class="fas fa-arrow-left mr-2 group-hover:-translate-x-1 transition-transform"></i>
                    Back to Dashboard
                </a>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight">Feedback Center</h1>
                <p class="text-slate-500 text-sm mt-0.5" id="userWelcome">Share your complaints, suggestion tickets, or appreciation notices with HR</p>
            </div>
            <div>
                <span class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-full font-bold uppercase tracking-wider">
                    Employee Hub
                </span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
            <!-- Submit Feedback Form -->
            <div class="lg:col-span-2 bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 h-fit">
                <h3 class="text-xl font-bold mb-6 text-slate-700 flex items-center">
                    <i class="fas fa-paper-plane text-blue-500 mr-2"></i>
                    Submit Suggestion
                </h3>
                <form id="feedbackForm" onsubmit="submitFeedback(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Submitting As</label>
                        <div id="loggedInUserName" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-slate-500 text-sm font-semibold">
                            Loading...
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Category *</label>
                        <select id="fbCategory" required
                            class="w-full p-3.5 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all font-semibold">
                            <option value="Suggestion">Suggestion</option>
                            <option value="Grievance">Grievance</option>
                            <option value="Appreciation">Appreciation</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Subject *</label>
                        <input type="text" id="fbSubject" placeholder="e.g. Health Insurance policy feedback" required
                            class="w-full p-3.5 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all font-semibold">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-bold text-slate-400 uppercase">Message Details *</label>
                            <button type="button" onclick="aiPolishMessage()"
                                class="ai-btn flex items-center gap-1.5 text-[10px] font-black bg-gradient-to-r from-violet-500 to-purple-600 text-white px-2.5 py-1 rounded-md ai-badge">
                                <i class="fas fa-wand-magic-sparkles"></i> AI Polish
                            </button>
                        </div>
                        <div id="aiPolishLoader" class="hidden shimmer h-8 mb-2"></div>
                        <textarea id="fbMessage" placeholder="Elaborate your request or suggestion..." required
                            class="w-full p-4 bg-slate-50 border rounded-xl h-28 text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all resize-none"></textarea>
                    </div>
                    <div class="flex items-center p-1">
                        <input type="checkbox" id="isAnonymous" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                        <label for="isAnonymous" class="ml-3 text-xs font-semibold text-slate-500 select-none">Submit anonymously</label>
                    </div>
                    
                    <button type="submit" id="submitBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-md shadow-blue-100">
                        Send Feedback
                    </button>
                </form>
            </div>

            <!-- Feedback History List -->
            <div class="lg:col-span-3 bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                <h3 class="text-xl font-bold mb-6 text-slate-700 flex items-center">
                    <i class="fas fa-history text-emerald-500 mr-2"></i>
                    My Feedback History
                </h3>
                <div id="feedbackList" class="space-y-6">
                    <p class="text-slate-400 italic text-sm">Loading submission logs...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", function() {
            // Authentication check
            fetch('/api/current-user')
                .then(res => {
                    if (res.ok) return res.json();
                    window.location.href = 'login.html';
                })
                .then(user => {
                    currentUser = user;
                    document.getElementById('loggedInUserName').innerText = `${user.fullName} (${user.department || 'General Staff'})`;
                    document.getElementById('userWelcome').innerText = `Hello ${user.fullName}, write suggestion tickets or appreciation logs below.`;
                    fetchMyFeedbacks();
                })
                .catch(() => {
                    window.location.href = 'login.html';
                });
        });

        async function fetchMyFeedbacks() {
            if (!currentUser) return;
            try {
                const res = await fetch(`/api/feedback/my-feedbacks/${currentUser.id}`);
                const data = await res.json();
                const container = document.getElementById('feedbackList');

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="py-10 text-center text-slate-400 italic border border-dashed rounded-2xl">
                            You haven't submitted any feedback tickets yet.
                        </div>`;
                    return;
                }

                container.innerHTML = data.map(fb => {
                    const formattedDate = fb.submittedAt ? new Date(fb.submittedAt).toLocaleDateString(undefined, {
                        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    }) : 'Recent';

                    const statusPill = fb.status === 'Resolved' ? 'bg-emerald-50 text-emerald-700 border-emerald-100' :
                                       fb.status === 'Approved' ? 'bg-blue-50 text-blue-700 border-blue-100' :
                                       fb.status === 'Rejected' ? 'bg-rose-50 text-rose-700 border-rose-100' : 'bg-slate-100 text-slate-600 border-slate-200';

                    return `
                        <div class="bg-slate-50 border border-slate-100 p-6 rounded-[2rem] hover:border-blue-200 transition relative group">
                            <button onclick="deleteFeedback(${fb.id})" 
                                class="absolute top-6 right-6 text-slate-300 hover:text-rose-600 transition opacity-0 group-hover:opacity-100" 
                                title="Delete Suggestion">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                            <div class="flex justify-between items-center mb-4">
                                <span class="px-2.5 py-0.5 rounded-lg text-[9px] font-black uppercase tracking-wider bg-blue-50 text-blue-700 border border-blue-100">
                                    ${fb.category}
                                </span>
                                <span class="text-slate-400 text-[10px] font-semibold pr-6">${formattedDate}</span>
                            </div>
                            <h4 class="font-bold text-slate-800 mb-2">${fb.subject || 'No Subject'}</h4>
                            <p class="text-xs text-slate-500 leading-relaxed mb-4">${fb.message || '-'}</p>
                            <div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-wider">
                                <span class="px-2.5 py-1 rounded-lg border ${statusPill}">
                                    Status: ${fb.status || 'Pending'}
                                </span>
                                ${fb.anonymous ? `
                                    <span class="text-slate-400"><i class="fas fa-user-secret mr-1"></i> Anonymous Submission</span>
                                ` : ''}
                            </div>
                        </div>`;
                }).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('feedbackList').innerHTML = `<div class="p-6 text-center text-rose-500 bg-rose-50 rounded-2xl">Failed to load feedback log.</div>`;
            }
        }

        async function submitFeedback(event) {
            event.preventDefault();
            if (!currentUser) return;
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Sending Suggestion...";

            const payload = {
                employeeId: currentUser.id,
                category: document.getElementById('fbCategory').value,
                subject: document.getElementById('fbSubject').value,
                message: document.getElementById('fbMessage').value,
                anonymous: document.getElementById('isAnonymous').checked
            };

            try {
                const res = await fetch('/api/feedback/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("Feedback sent successfully! HR administrators will inspect it soon.");
                    document.getElementById('fbSubject').value = '';
                    document.getElementById('fbMessage').value = '';
                    document.getElementById('isAnonymous').checked = false;
                    fetchMyFeedbacks();
                } else {
                    alert("Failed to submit feedback.");
                }
            } catch (err) {
                console.error(err);
                alert("Connection error.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Send Feedback";
            }
        }

        async function deleteFeedback(id) {
            if (!confirm("Are you sure you want to delete this feedback log?")) return;
            try {
                const res = await fetch(`/api/feedback/${id}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    fetchMyFeedbacks();
                } else {
                    alert("Failed to delete feedback.");
                }
            } catch (err) {
                console.error(err);
            }
        }

        /* ─── GEMINI AI ─── */
        const GEMINI_KEY = "AIzaSyDemo_Replace_With_Your_Key";
        async function callGemini(prompt) {
            const r = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,
                { method:'POST', headers:{'Content-Type':'application/json'},
                  body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] }) }
            );
            if (!r.ok) throw new Error('API error');
            const d = await r.json();
            return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
        }

        async function aiPolishMessage() {
            const txtArea = document.getElementById('fbMessage');
            const loader = document.getElementById('aiPolishLoader');
            const originalText = txtArea.value.trim();

            if (!originalText) {
                alert("Please write some feedback first.");
                return;
            }

            loader.classList.remove('hidden');
            txtArea.disabled = true;

            const prompt = `Rewrite this employee feedback to sound more professional, constructive, and polite while maintaining the original meaning. Return only the rewritten text. Feedback: "${originalText}"`;

            try {
                const polished = await callGemini(prompt);
                txtArea.value = polished.trim();
            } catch(e) {
                // Fallback
                txtArea.value = "I am writing to formally share my feedback: " + originalText;
            }

            loader.classList.add('hidden');
            txtArea.disabled = false;
        }
    </script>
</body>

</html>
