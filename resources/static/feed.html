<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Workplace Buzz Feed | SmartHR AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .ai-btn { transition: all .2s; }
        .ai-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(99,102,241,.25); }
        .shimmer {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            border-radius: 12px;
        }
        @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }
        .ai-badge { animation: pulseBadge 2s infinite; }
        @keyframes pulseBadge {
            0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,.4); }
            50%      { box-shadow: 0 0 0 6px rgba(99,102,241,0); }
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-12">
    <div class="max-w-2xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-black italic tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-500 uppercase">
                    Buzz Feed
                </h1>
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mt-0.5">Stay connected with your coworkers</p>
            </div>
            <button onclick="location.href='index.html'" class="text-slate-500 hover:text-white transition-all text-xl p-2" title="Back to Dashboard">
                <i class="fas fa-times"></i>
            </button>
        </header>

        <!-- Create Post Card -->
        <div class="bg-slate-900/40 border border-white/5 p-6 rounded-[2rem] mb-10 shadow-2xl backdrop-blur-md">
            <div class="mb-4">
                <label class="text-[9px] font-black uppercase text-slate-500 tracking-wider block mb-2">Publishing as:</label>
                <div class="bg-slate-950/80 border border-white/5 text-blue-400 text-xs font-bold p-3.5 rounded-xl w-full flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span id="loggedInUserName">Loading profile...</span>
                </div>
            </div>

            <textarea id="postInput" placeholder="Share an update, milestone, or announcement with the team..."
                class="w-full bg-transparent border-none outline-none text-slate-100 placeholder-slate-600 resize-none mb-4 text-sm leading-relaxed"
                rows="3"></textarea>

            <div id="aiFeedLoader" class="hidden shimmer h-8 w-full mb-3"></div>
            <div class="flex justify-between items-center border-t border-white/5 pt-4">
                <div class="flex items-center space-x-4 text-slate-500">
                    <button class="hover:text-blue-400 transition" title="Add Photo"><i class="fas fa-camera"></i></button>
                    <button class="hover:text-blue-400 transition" title="Mention"><i class="fas fa-at"></i></button>
                    <button type="button" onclick="aiEnhancePost()"
                        class="ai-btn ml-2 flex items-center gap-1.5 text-[10px] font-black bg-gradient-to-r from-violet-500 to-purple-600 text-white px-2.5 py-1.5 rounded-md ai-badge">
                        <i class="fas fa-wand-magic-sparkles"></i> AI Enhance
                    </button>
                </div>
                <button onclick="submitPost()" id="publishBtn"
                    class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-2.5 rounded-xl text-xs font-black transition shadow-lg shadow-blue-500/10">
                    PUBLISH
                </button>
            </div>
        </div>

        <!-- Feed List -->
        <div id="feedContainer" class="space-y-6">
            <div class="text-center py-10 text-slate-600 font-bold animate-pulse">Loading dynamic feed...</div>
        </div>
    </div>

    <script>
        let currentUserId = null;

        document.addEventListener("DOMContentLoaded", function() {
            // Authentication check
            fetch('/api/current-user')
                .then(res => {
                    if (res.ok) return res.json();
                    window.location.href = 'login.html';
                })
                .then(sessionUser => {
                    document.getElementById('loggedInUserName').innerText = sessionUser.fullName;
                    currentUserId = sessionUser.id;
                    
                    // Fetch matching Employee record
                    return fetch('/api/employees/me');
                })
                .then(res => {
                    if (res && res.ok) return res.json();
                })
                .then(emp => {
                    if (emp) {
                        currentUserId = emp.id;
                    }
                    loadFeeds();
                })
                .catch(() => {
                    window.location.href = 'login.html';
                });
        });

        async function loadFeeds() {
            try {
                const res = await fetch('/api/feeds/all');
                const posts = await res.json();
                const container = document.getElementById('feedContainer');
                
                if (!posts || posts.length === 0) {
                    container.innerHTML = `
                        <div class="py-12 bg-slate-900/10 border border-white/5 rounded-[2rem] text-center text-slate-500 italic">
                            <i class="fas fa-hashtag text-3xl mb-3 text-slate-600 block"></i>
                            No buzz updates have been posted yet. Be the first!
                        </div>`;
                    return;
                }

                container.innerHTML = posts.map(post => {
                    const initials = post.fullName ? post.fullName.charAt(0).toUpperCase() : '?';
                    const formattedDate = post.createdAt ? new Date(post.createdAt).toLocaleDateString(undefined, {
                        month: 'short', day: 'numeric', year: 'numeric'
                    }) : 'Recent';

                    return `
                        <div class="bg-slate-900/20 border border-white/5 p-6 rounded-[2rem] hover:border-blue-500/10 transition duration-150">
                            <div class="flex items-center mb-5">
                                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-cyan-500 flex items-center justify-center font-black text-white text-base">
                                    ${initials}
                                </div>
                                <div class="ml-3.5">
                                    <h4 class="font-bold text-slate-200 text-sm leading-none">${post.fullName}</h4>
                                    <span class="text-[9px] font-black uppercase text-blue-400/60 tracking-wider mt-1 block">${post.designation || 'Specialist'}</span>
                                </div>
                                <span class="ml-auto text-[9px] font-bold text-slate-600 uppercase tracking-wider">${formattedDate}</span>
                            </div>
                            
                            <p class="text-slate-300 text-sm leading-relaxed mb-5 font-medium whitespace-pre-wrap">${post.content}</p>

                            <div class="flex items-center gap-6 text-slate-500 pt-4 border-t border-white/5 text-xs font-bold uppercase tracking-wider">
                                <button onclick="likePost(${post.id})" class="hover:text-rose-500 transition flex items-center gap-2">
                                    <i class="fas fa-heart text-xs"></i> 
                                    <span>${post.likesCount || 0} Likes</span>
                                </button>
                                <div class="text-slate-600 flex items-center gap-2">
                                    <i class="fas fa-comment text-xs"></i> 
                                    <span>0 Comments</span>
                                </div>
                            </div>
                        </div>`;
                }).join('');
            } catch (err) {
                console.error("Error loading feed:", err);
                document.getElementById('feedContainer').innerHTML = `<div class="p-6 text-center text-rose-400 bg-rose-950/20 rounded-2xl">Error downloading buzz updates.</div>`;
            }
        }

        async function submitPost() {
            const content = document.getElementById('postInput').value.trim();
            if (!content || !currentUserId) return;

            const btn = document.getElementById('publishBtn');
            btn.disabled = true;
            btn.innerText = "PUBLISHING...";

            try {
                const response = await fetch('/api/feeds/post', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        employeeId: currentUserId,
                        content: content
                    })
                });

                if (response.ok) {
                    document.getElementById('postInput').value = '';
                    loadFeeds();
                } else {
                    alert("Failed to submit post.");
                }
            } catch (err) {
                console.error(err);
                alert("Connection error.");
            } finally {
                btn.disabled = false;
                btn.innerText = "PUBLISH";
            }
        }

        async function likePost(id) {
            try {
                const res = await fetch(`/api/feeds/like/${id}`, { method: 'POST' });
                if (res.ok) {
                    loadFeeds();
                }
            } catch (err) {
                console.error(err);
            }
        }

        /* ─── GEMINI AI ─── */
        const GEMINI_KEY = "AIzaSyDemo_Replace_With_Your_Key";
        async function callGemini(prompt) {
            const r = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,
                { method:'POST', headers:{'Content-Type':'application/json'},
                  body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] }) }
            );
            if (!r.ok) throw new Error('API error');
            const d = await r.json();
            return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
        }

        async function aiEnhancePost() {
            const txtArea = document.getElementById('postInput');
            const loader = document.getElementById('aiFeedLoader');
            const originalText = txtArea.value.trim();

            if (!originalText) {
                alert("Please write something first.");
                return;
            }

            loader.classList.remove('hidden');
            txtArea.disabled = true;

            const prompt = `Rewrite this employee social feed post to be more engaging, positive, and professional. Keep it to a similar length. Original: "${originalText}"`;

            try {
                const enhanced = await callGemini(prompt);
                txtArea.value = enhanced.trim();
            } catch(e) {
                // Fallback
                txtArea.value = originalText + " ✨ Excited for the journey ahead with the team! ✨";
            }

            loader.classList.add('hidden');
            txtArea.disabled = false;
        }
    </script>
</body>

</html>
