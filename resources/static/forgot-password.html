<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SmartHR AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/global-impressive.css">
</head>
<body class="bg-gradient-to-br from-blue-600 to-indigo-700 min-h-screen flex items-center justify-center relative">

    <a href="login.html"
        class="absolute top-8 left-8 text-slate-600 hover:text-slate-900 transition-colors flex items-center font-bold bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200">
        <i class="fas fa-arrow-left mr-2"></i> Back to Login
    </a>

    <div class="w-full max-w-md z-10">
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600 text-2xl">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="text-3xl font-bold text-slate-800">Forgot Password</h1>
                <p class="text-slate-500 mt-2">Enter your email to reset your password</p>
                <div id="resetMessage" class="hidden mt-4 p-3 rounded-lg text-sm font-semibold"></div>
            </div>

            <form id="forgotPasswordForm" class="space-y-4">
                <div>
                    <label class="block text-slate-700 font-semibold mb-2">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                
                <div class="mb-4">
                    <label class="block text-slate-700 font-semibold mb-2">Security Check (CAPTCHA)</label>
                    <div class="flex items-center space-x-3">
                        <div class="bg-slate-200 p-2 rounded-lg border border-slate-300 font-mono font-bold text-slate-800 tracking-widest text-center w-32 shadow-inner"
                            id="captchaQuestion">
                            ? + ? =
                        </div>
                        <input type="number" id="captchaAnswer" required placeholder="Answer"
                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <p id="captchaError" class="text-red-500 text-xs mt-1 hidden font-semibold">Incorrect CAPTCHA answer. Please try again.</p>
                </div>
                
                <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg">
                    Send Reset Link
                </button>
            </form>
        </div>
    </div>
    
    <script>
        // CAPTCHA Logic
        let captchaExpectedAnswer = 0;

        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            captchaExpectedAnswer = num1 + num2;
            document.getElementById('captchaQuestion').innerText = `${num1} + ${num2} =`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            generateCaptcha();
        });

        document.getElementById('forgotPasswordForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const userAnswer = parseInt(document.getElementById('captchaAnswer').value, 10);
            
            if (userAnswer !== captchaExpectedAnswer) {
                document.getElementById('captchaError').classList.remove('hidden');
                generateCaptcha();
                document.getElementById('captchaAnswer').value = '';
            } else {
                document.getElementById('captchaError').classList.add('hidden');
                
                // Submit to backend
                const email = document.getElementById('email').value;
                const formData = new URLSearchParams();
                formData.append('email', email);
                
                fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                })
                .then(response => response.text())
                .then(data => {
                    const msgDiv = document.getElementById('resetMessage');
                    msgDiv.textContent = data;
                    msgDiv.className = 'mt-4 p-3 rounded-lg text-sm font-semibold bg-green-100 text-green-700';
                    msgDiv.classList.remove('hidden');
                    document.getElementById('forgotPasswordForm').reset();
                    generateCaptcha();
                })
                .catch(err => {
                    const msgDiv = document.getElementById('resetMessage');
                    msgDiv.textContent = 'An error occurred. Please try again.';
                    msgDiv.className = 'mt-4 p-3 rounded-lg text-sm font-semibold bg-red-100 text-red-700';
                    msgDiv.classList.remove('hidden');
                });
            }
        });
    </script>
</body>
</html>
