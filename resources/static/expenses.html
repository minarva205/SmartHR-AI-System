<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartHR — Expense Claims AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #0b1329 0%, #1c2541 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .icon { width: 88px; height: 88px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.5rem; box-shadow: 0 0 40px rgba(99,102,241,.4); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1);opacity:.9} 50%{transform:scale(1.05);opacity:1} }
        h1 { color: #fff; font-weight: 800; font-size: 1.8rem; margin: 0 0 .5rem; background: linear-gradient(90deg,#818cf8,#a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; font-size: .9rem; }
        .bar { width: 220px; height: 3px; background: #1e293b; border-radius: 99px; overflow: hidden; margin: 1.5rem auto 0; }
        .bar-inner { height: 100%; background: linear-gradient(90deg,#6366f1,#8b5cf6); border-radius: 99px; animation: load 1.4s ease-in-out infinite; }
        @keyframes load { 0%{transform:translateX(-100%);width:40%} 50%{width:70%} 100%{transform:translateX(250%);width:40%} }
        .center { text-align: center; }
    </style>
</head>
<body>
    <div class="center">
        <div class="icon">🧾</div>
        <h1>Expense Claims AI</h1>
        <p>Detecting your role and loading workspace…</p>
        <div class="bar"><div class="bar-inner"></div></div>
    </div>
    <script>
        fetch('/api/current-user').then(r => r.ok ? r.json() : Promise.reject())
            .then(u => { window.location.href = u.role === 'ADMIN' ? 'expenses-admin.html' : 'expenses-employee.html'; })
            .catch(() => { window.location.href = 'login.html'; });
    </script>
</body>
</html>
